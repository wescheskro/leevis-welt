name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LeevisWelt.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LeevisWelt-APK
        path: android/app/build/outputs/apk/debug/LeevisWelt.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-v1.0.${{ github.run_number }}
        name: "Leevis Welt APK v1.0.${{ github.run_number }}"
        files: android/app/build/outputs/apk/debug/LeevisWelt.apk
        body: |
          **Leevis Welt** - Android Launcher APK

          Einfach `LeevisWelt.apk` herunterladen und auf dem Tablet installieren.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
